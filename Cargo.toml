[package]
name = "io-sasl"
description = "Simple Authentication and Security Layer (SASL) client library for Rust"
version = "0.1.0"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
rust-version = "1.87"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["api-bindings", "no-std", "authentication"]
keywords = ["io-free", "no-std", "coroutine", "sasl", "scram"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/io-sasl/latest/io_sasl"
repository = "https://github.com/pimalaya/io-sasl"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["client", "saslprep", "scram"]
client = []
cram-md5 = ["dep:hmac", "dep:md-5"]
saslprep = ["dep:unicode-normalization"]
scram = ["dep:base64", "dep:hmac", "dep:pbkdf2", "dep:sha2"]
scram-sha-1 = ["scram", "dep:sha1"]

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["alloc"], optional = true }
hmac = { version = "0.13", default-features = false, optional = true }
log = { version = "0.4", default-features = false }
md-5 = { version = "0.11.0", default-features = false, optional = true }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"], optional = true }
secrecy = { version = "0.10", default-features = false }
sha1 = { version = "0.11", default-features = false, optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
thiserror = { version = "2", default-features = false }
unicode-normalization = { version = "0.1.25", default-features = false, optional = true }
